rtsp:
  enable: true
  live_source: true
  transport: tcp
  watch_timeout_sec: 5
  max_retries: 5
  backoff_base_ms: 1000
  backoff_max_ms: 15000
  verify_sec: 5
  min_fps: 1.0
  rtspsrc_latency_ms: 500
  first_frame_timeout_sec: 12
mux:
  output_width: 1280
  output_height: 720
  batch_timeout_usec: 40000
inference:
  enable: true
  config_file_path: configs/nvinfer_yolo11s_b4_fp16.txt
  gie_unique_id: 1
tracker:
  enable: true
  ll_lib_file: /opt/nvidia/deepstream/deepstream-7.1/lib/libnvds_nvmultiobjecttracker.so
  ll_config_file: /opt/nvidia/deepstream/deepstream-7.1/samples/configs/deepstream-app/config_tracker_NvDCF_perf.yml
  width: 960
  height: 544
  gpu_id: 0
output:
  jsonl_path: /home/seeed/projects/jetedge-agent/logs/single_cam1_det.jsonl
  labels_file_path: /home/seeed/projects/jetedge-agent/configs/coco_labels.txt
  fps_report_interval_sec: 5
events:
  enable: true
  jsonl_path: /home/seeed/projects/jetedge-agent/logs/single_cam1_ev.jsonl
  keyframe_dir: /home/seeed/projects/jetedge-agent/logs/keyframes_single_cam1
  max_keyframes: 150
  jpeg_quality: 85
  disappear_grace_frames: 15
  count_threshold: 3
  count_hysteresis: 1
  classes:
  - 0
  - 1
  - 2
  - 3
  - 5
  - 7
  zones:
  - name: road
    stream_id: cam1
    rect:
    - 0
    - 250
    - 1280
    - 470
llm:
  enable: false
  keyframe_dir: /home/seeed/projects/jetedge-agent/logs/keyframes
  cloud_output_path: /home/seeed/projects/jetedge-agent/logs/stage8_analysis.jsonl
  deepseek_interval_sec: 60
streams:
- id: cam1
  type: rtsp
  uri: rtsp://127.0.0.1:8554/cam1
  priority: high
  expected_fps: 30
