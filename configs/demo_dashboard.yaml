# JetEdge-Agent dashboard demo — continuous RTSP run with remote-browser
# access (2026-08-05, Stage 15).
#
# Differences from the Stage 14 acceptance config are deliberate:
#   - control.host: 0.0.0.0  → the dashboard is reachable from any browser
#     on the LAN at http://<jetson-ip>:8091/dashboard.  SECURITY NOTE: the
#     Control API (including the §16 write ops) is then exposed on the LAN
#     without authentication — use only on trusted networks.
#   - control.cors: true     → cross-origin reads for the web dashboard.
#   - llm.enable: false      → no cloud API cost during the demo; events and
#     keyframes still flow (local-first).
#   - distinct output paths  → never mixes with other runs' evidence.
#
# Requires the local RTSP stack: scripts/rtsp_serve.sh server-start +
# cam-start cam1..4 (MediaMTX publishing the 4 DeepStream sample streams).

rtsp:
  enable: true
  live_source: true
  transport: tcp
  watch_timeout_sec: 5
  first_frame_timeout_sec: 12
  max_retries: 5
  backoff_base_ms: 1000
  backoff_max_ms: 15000
  verify_sec: 5
  min_fps: 1.0
  rtspsrc_latency_ms: 500

mux:
  output_width: 1280
  output_height: 720
  batch_timeout_usec: 40000

inference:
  enable: true
  config_file_path: configs/nvinfer_yolo11s_b4_fp16.txt
  gie_unique_id: 1

tracker:
  enable: true
  ll_lib_file: /opt/nvidia/deepstream/deepstream-7.1/lib/libnvds_nvmultiobjecttracker.so
  ll_config_file: /opt/nvidia/deepstream/deepstream-7.1/samples/configs/deepstream-app/config_tracker_NvDCF_perf.yml
  width: 960
  height: 544
  gpu_id: 0

output:
  jsonl_path: /home/seeed/projects/jetedge-agent/logs/demo_dashboard_detections.jsonl
  labels_file_path: /home/seeed/projects/jetedge-agent/configs/coco_labels.txt
  fps_report_interval_sec: 5

events:
  enable: true
  jsonl_path: /home/seeed/projects/jetedge-agent/logs/demo_dashboard_events.jsonl
  keyframe_dir: /home/seeed/projects/jetedge-agent/logs/keyframes_demo_dashboard
  max_keyframes: 150
  jpeg_quality: 85
  disappear_grace_frames: 15
  count_threshold: 3
  count_hysteresis: 1
  classes: [0, 1, 2, 3, 5, 7]
  zones:
    - name: road
      stream_id: cam1
      rect: [0, 250, 1280, 470]

llm:
  enable: false
  keyframe_dir: /home/seeed/projects/jetedge-agent/logs/keyframes_demo_dashboard
  cloud_output_path: /home/seeed/projects/jetedge-agent/logs/demo_dashboard_analysis.jsonl
  deepseek_interval_sec: 60

scheduler:
  enable: true
  sample_interval_sec: 2
  pressure_cpu_enter: 70.0
  pressure_cpu_exit: 50.0
  thermal_temp_enter: 75.0
  thermal_temp_exit: 70.0
  critical_temp_enter: 82.0
  critical_temp_exit: 76.0
  min_hold_sec: 15
  cooldown_sec: 30
  max_adjustments_per_window: 2
  adjust_window_sec: 120

control:
  enable: true
  host: 0.0.0.0
  port: 8091
  cors: true
  dashboard_file: web/dashboard.html
  state_dir: /home/seeed/projects/jetedge-agent/logs/control_demo_dashboard
  max_body_bytes: 4096
  read_timeout_ms: 5000
  max_infer_interval: 5
  restart_min_interval_ms: 30000
  max_snapshots: 32
  benchmark_min_duration_s: 5
  benchmark_max_duration_s: 120
  benchmark_default_duration_s: 60

streams:
  - id: cam1
    type: rtsp
    uri: rtsp://127.0.0.1:8554/cam1
    priority: high
    expected_fps: 30

  - id: cam2
    type: rtsp
    uri: rtsp://127.0.0.1:8554/cam2
    priority: normal
    expected_fps: 30

  - id: cam3
    type: rtsp
    uri: rtsp://127.0.0.1:8554/cam3
    priority: normal
    expected_fps: 30

  - id: cam4
    type: rtsp
    uri: rtsp://127.0.0.1:8554/cam4
    priority: low
    expected_fps: 30
